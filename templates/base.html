<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Tienda{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}">Inicio</a></li>
            
            {% if session.get('user_id') %}
                <li><a href="{{ url_for('carrito_ver') }}">Carrito</a></li>

                {% if session.get('user_role') == 'admin' %}
                    <li><a href="{{ url_for('producto_nuevo') }}">Nuevo Producto</a></li>
                {% endif %}

                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            {% else %}
                <li><a href="{{ url_for('login_ver') }}">Login</a></li>
                <li><a href="{{ url_for('register_ver') }}">Registro</a></li>
            {% endif %}
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
